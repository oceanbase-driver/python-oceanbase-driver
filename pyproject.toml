[project]
name = "pyoceanbase"
description = "Pure Python OceanBase Driver (PyMySQL fork with Oracle tenant support)"
authors = [
    {name = "Inada Naoki", email = "songofacandy@gmail.com"},
    {name = "Yutaka Matsubara", email = "yutaka.matsubara@gmail.com"}
]
dependencies = []

requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["MySQL"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dynamic = ["version"]

[project.optional-dependencies]
"rsa" = [
    "cryptography>=46.0.7"
]
"ed25519" = [
    "PyNaCl>=1.6.2"
]
"sqlalchemy" = [
    "SQLAlchemy>=1.4"
]

[project.entry-points."sqlalchemy.dialects"]
oceanbase = "pyoceanbase.sqlalchemy:OceanBaseDialect_pyoceanbase"
"oceanbase.pyoceanbase" = "pyoceanbase.sqlalchemy:OceanBaseDialect_pyoceanbase"
oceanbase_oracle = "pyoceanbase.sqlalchemy_oracle:OceanBaseOracleDialect_pyoceanbase"
"oceanbase_oracle.pyoceanbase" = "pyoceanbase.sqlalchemy_oracle:OceanBaseOracleDialect_pyoceanbase"

[project.urls]
"Project" = "https://github.com/oceanbase-driver/python-oceanbase-driver"
"Changelog" = "https://github.com/oceanbase-driver/python-oceanbase-driver/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = false
include = ["pyoceanbase*"]
exclude = ["tests*", "pyoceanbase.tests*"]

[tool.setuptools.dynamic]
version = {attr = "pyoceanbase.VERSION_STRING"}

[tool.ruff]
exclude = [
    "pyoceanbase/tests/thirdparty",
]

[tool.ruff.lint]
ignore = ["E721"]

[tool.pdm.dev-dependencies]
dev = [
    "pytest-cov>=4.0.0",
]
